[defaults]
inventory = hosts.ini
remote_user = ubuntu

# Host key verification is on deliberately. Turning it off accepts whatever key
# the connection presents, which allows a man-in-the-middle attack against the
# pipeline. The GitHub Actions workflow resolves the host with `ssh-keyscan`
# before running Ansible, so there is no reason to relax this.
host_key_checking = True

# Fail fast: an instance that is off or without network must not leave the
# pipeline hanging for 30 minutes.
timeout = 30
gathering = smart
fact_caching = jsonfile
fact_caching_connection = .ansible_facts_cache
fact_caching_timeout = 3600

# Per-task progress: on a long deployment this gives real visibility into where
# it is stuck, unlike the default black-box output.
callbacks_enabled = ansible.posix.profile_tasks

# Deprecation warnings visible: the goal is to not depend on modules Ansible is
# going to remove.
deprecation_warnings = True
nocows = 1
retry_files_enabled = False

interpreter_python = auto_silent

[ssh_connection]
pipelining = True
# Reuse the SSH connection across tasks and modules: on the GCP free tier the
# handshake is a meaningful share of total deployment time.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o IdentitiesOnly=yes -o ServerAliveInterval=30
# The e2-micro instance suspends after minutes of inactivity; this detects a
# dead host sooner than the default timeout does.
retries = 3

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False