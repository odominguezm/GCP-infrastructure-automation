---
# Ansible collections required.
#   ansible-galaxy collection install -r requirements.yml
#
# The lower bounds are not arbitrary: each is the minimum version that provides
# the module this project uses. Going higher is optional; going lower breaks the
# deployment with a not-very-descriptive "module not found".
#
# IMPORTANT: community.docker 5.x requires ansible-core >= 2.17. The CI workflow
# (`.github/workflows/main.yml`) installs `ansible-core>=2.17,<2.20`; keep this
# comment in sync with that pin instead of assuming the local environment.

collections:
  # Module used: community.docker.docker_compose_v2
  - name: community.docker
    version: ">=3.4.0"

  # Modules used: ansible.posix.mount, ansible.posix.sysctl, plus the
  # ansible.posix.profile_tasks callback declared in ansible.cfg.
  - name: ansible.posix
    version: ">=1.5.4"
