# Example inventory. Copy to hosts.ini and adjust.
#
#   cp inventory.example.ini hosts.ini
#
# hosts.ini is covered by .gitignore on purpose: it contains real server data.
#
# SSH is NOT reachable on a public IP: port 22 only accepts the IAP range, and
# in the default free profile the VM has no external IP at all. The recommended
# inventory therefore points at the local end of an IAP tunnel:
#
#   gcloud compute start-iap-tunnel instancia-devops-gcp 22 \
#     --local-host-port=localhost:2222 \
#     --project=<TU_PROYECTO> --zone=us-central1-a &
#   ssh-keyscan -H -p 2222 127.0.0.1 >> ~/.ssh/known_hosts
#
# The CI workflow builds exactly this inventory on the runner.

[gcp_servers]
gcp-server ansible_host=127.0.0.1 ansible_port=2222 ansible_user=ubuntu

[gcp_servers:vars]
ansible_python_interpreter=/usr/bin/python3

# Locally the operator key is used; CI injects it with `--private-key`. No
# production key path is hardcoded anywhere.
# ansible_ssh_private_key_file=~/.ssh/id_deploy_gcp

# If you deliberately build inside the VM (ansible_connection=local), use
# hosts.ini instead: it already does this. Do not mix the two modes.
