---
# Swap: the single definition of its size and policy. This logic used to be
# duplicated in config_swap.yml (4 GB) and deploy_all.yml (2 GB).

- name: Validate the swap settings are sane
  ansible.builtin.assert:
    that:
      - swap_size_gb | int > 0
      - vm_swappiness | int <= 60
    fail_msg: >-
      swap_size_gb must be > 0 and vm_swappiness <= 60. Above 60 the system
      starts paging to disk aggressively and performance degrades. Got
      swap_size_gb={{ swap_size_gb }}, vm_swappiness={{ vm_swappiness }}.
    quiet: true
  when: swap_enabled | bool

# --- 1. Create the file --------------------------------------------------
# `creates` makes the whole chain idempotent in a single task: if the file
# already exists it is not reformatted. Reformatting an existing swap would
# leave the machine without swap until the next reboot.
- name: Create and format the swap file
  ansible.builtin.command: >-
    fallocate -l {{ swap_size_gb | int }}G {{ swap_file_path }}
    && chmod 600 {{ swap_file_path }}
    && mkswap {{ swap_file_path }}
  args:
    creates: "{{ swap_file_path }}"
  when: swap_enabled | bool

# --- 2. Permissions ------------------------------------------------------
# Runs unconditionally: it fixes the mode even if the file already existed
# with 0644 (a world-readable swap).
- name: Enforce restrictive permissions on the swap file
  ansible.builtin.file:
    path: "{{ swap_file_path }}"
    state: file
    mode: "0600"
    owner: root
    group: root
  when: swap_enabled | bool

# --- 3. Activate ---------------------------------------------------------
- name: Detect the swap that is already active
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false
  failed_when: false
  check_mode: false

- name: Activate the swap
  ansible.builtin.command: swapon {{ swap_file_path }}
  when:
    - swap_enabled | bool
    - swap_file_path not in (swap_active.stdout | default('') | split('\n'))
  register: swap_activated
  changed_when: true

- name: Deactivate the swap when the configuration disables it
  ansible.builtin.command: swapoff {{ swap_file_path }}
  when:
    - not (swap_enabled | bool)
    - swap_file_path in (swap_active.stdout | default('') | split('\n'))
  changed_when: true

# --- 4. Persistence ------------------------------------------------------
- name: Make the swap persistent in /etc/fstab
  ansible.posix.mount:
    name: none
    src: "{{ swap_file_path }}"
    fstype: swap
    opts: sw
    passno: "0"
    dump: "0"
    state: present
  when: swap_enabled | bool

# --- 5. Paging policy ----------------------------------------------------
- name: Tune vm.swappiness (use physical RAM before disk)
  ansible.posix.sysctl:
    name: vm.swappiness
    value: "{{ vm_swappiness | int }}"
    state: present
    sysctl_file: /etc/sysctl.d/99-swap-tuning.conf
    reload: true

- name: Read the active swap state
  ansible.builtin.command: swapon --show=NAME,SIZE --noheadings
  register: swap_final
  changed_when: false
  check_mode: false
  when: swap_enabled | bool

- name: Confirm the swap is live
  ansible.builtin.assert:
    that:
      - swap_file_path in (swap_final.stdout | default(''))
    fail_msg: >-
      Swap was configured but is not active. Check `swapon --show` and
      `dmesg | tail` on {{ inventory_hostname }}.
    quiet: true
  when: swap_enabled | bool