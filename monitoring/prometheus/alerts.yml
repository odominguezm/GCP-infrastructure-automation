---
# ============================================================
# Prometheus alerting rules
#
# Criterion for picking a rule: every alert exists because somebody has to do
# something concrete when it fires. An alert with no associated action is noise,
# and noise trains people to ignore alerts, which is the worst possible outcome.
#
# Conventions:
#   severity: critical | warning | info
#   "info" is reserved for things that need no immediate action.
# ============================================================
groups:
  # ------------------------------------------------------------
  # Availability: is the service responding?
  # ------------------------------------------------------------
  - name: availability
    rules:
      - alert: TargetDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Target {{ $labels.job }} down on {{ $labels.instance }}"
          description: >-
            Prometheus has not been able to scrape {{ $labels.job }} for more
            than 2 minutes. The service may be stopped or the scrape may be
            misconfigured.
          impact: "Visibility of {{ $labels.job }} is lost; its own alerts stop evaluating too."

      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 5m
        labels:
          severity: critical
          component: monitoring
        annotations:
          summary: "Prometheus config fails to reload"
          description: >-
            The last `POST /-/reload` of the Prometheus configuration failed.
            Prometheus keeps running with the previous configuration, but any
            change to rules.yml is not being applied.
          impact: "New or changed rules do not exist for Prometheus."
          runbook: docs/runbooks/alerting.md#configuracion

      # Dead man's switch. This alert always fires, even when everything is
      # perfect. Its purpose is the opposite of the others: if it stops reaching
      # the external receiver, the alerting system itself is the problem.
      # Without it, a dead Alertmanager can go unnoticed for weeks.
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: info
          component: monitoring
        annotations:
          summary: "Alerting system heartbeat"
          description: "This alert should always fire. If it stops arriving, check Alertmanager."

  # ------------------------------------------------------------
  # Resources: can it keep up?
  # ------------------------------------------------------------
  - name: resources
    rules:
      - alert: HostHighMemoryUsage
        expr: >-
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.85
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Memory usage above 85% on {{ $labels.instance }}"
          description: >-
            The instance has been using more than 85% of its physical RAM for
            over 10 minutes. On an e2-micro (1 GB) that leaves little headroom
            before swap kicks in.
          impact: "High latency and risk of the OOM killer."
          runbook: docs/runbooks/alerting.md#memory

      - alert: HostCriticalMemoryUsage
        expr: >-
          (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) > 0.95
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Memory nearly exhausted on {{ $labels.instance }}"
          description: >-
            Memory usage above 95% sustained for 5 minutes. The kernel OOM
            killer will start terminating processes.
          impact: "Unrequested service outages."
          runbook: docs/runbooks/alerting.md#memory

      - alert: HostHighSwapUsage
        # Swap itself is not a fault on such a small instance: it exists precisely
        # to absorb spikes. What is a fault is swap being permanently busy,
        # which means the RAM does not cover the normal workload.
        expr: >-
          (1 - (node_memory_SwapFree_bytes / node_memory_SwapTotal_bytes)) > 0.50
        for: 30m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "More than 50% of swap in use on {{ $labels.instance }}"
          description: >-
            Swap has been above 50% for more than 30 minutes. The normal workload
            no longer fits in 1 GB of RAM and the system is paging to disk on a
            sustained basis.
          impact: "Constantly elevated latency."
          runbook: docs/runbooks/alerting.md#swap

      - alert: HostDiskSpaceLow
        expr: >-
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 10m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "Root disk below 15% free on {{ $labels.instance }}"
          description: >-
            Less than 4.5 GB free on a 30 GB disk. The disk cannot be enlarged on
            the free tier, so space has to be reclaimed.
          impact: "Prometheus and Docker stop writing; the system can become unusable."
          runbook: docs/runbooks/alerting.md#disk

      - alert: HostDiskSpaceCritical
        expr: >-
          node_filesystem_avail_bytes{mountpoint="/"}
            / node_filesystem_size_bytes{mountpoint="/"} < 0.05
        for: 5m
        labels:
          severity: critical
          component: host
        annotations:
          summary: "Root disk critically full on {{ $labels.instance }}"
          description: "Less than 5% of the root disk is free. Escalate to an incident."
          impact: "Data loss as soon as it fills up."
          runbook: docs/runbooks/alerting.md#disk

      - alert: HostHighCpuLoad
        # Load is compared against the number of cores: a load of 4 is a problem
        # on a 2-core machine and not on a 16-core one.
        expr: >-
          node_load15 / count(node_cpu_seconds_total{mode="idle"}) > 1.5
        for: 15m
        labels:
          severity: warning
          component: host
        annotations:
          summary: "High CPU load on {{ $labels.instance }}"
          description: >-
            The 15-minute load average is above 1.5 per core. Possible runaway
            container or a TSDB compaction process.
          impact: "High latency across every service on the host."

  # ------------------------------------------------------------
  # Capacity: something that will fill up even though nothing is broken yet?
  # ------------------------------------------------------------
  - name: capacity
    rules:
      - alert: PrometheusHighCardinality
        # If the series count grows out of control the TSDB will stop fitting on
        # disk. Warn early enough to reduce it.
        expr: prometheus_tsdb_head_series > 5000
        for: 30m
        labels:
          severity: warning
          component: monitoring
        annotations:
          summary: "High Prometheus cardinality ({{ $value }} series)"
          description: >-
            The number of in-memory series is above 5000. With 1 GB of RAM for
            Prometheus, high cardinality consumes memory and shortens the
            effective TSDB retention.
          impact: "Higher RAM usage and a TSDB truncated sooner than expected."

  # ------------------------------------------------------------
  # Containers.
  #
  # The `containers` alert group was removed together with cAdvisor (the exporter
  # that fed every rule in it). See group_vars/all/main.yml for the diagnosis: with
  # the exporter gone the group was dead weight except for one rule that would
  # have fired permanently, so keeping it was not an option. Restore it from git
  # in the same change that brings cAdvisor back.
  # ------------------------------------------------------------
