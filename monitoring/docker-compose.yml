---
# ============================================================
# Observability stack: Prometheus + node-exporter + Grafana
#
# Memory budget of the instance (e2-micro, 1 GB of physical RAM):
#
#   grafana                288 MiB
#   cadvisor               160 MiB
#   prometheus             192 MiB
#   nginx-proxy-manager    128 MiB
#   alertmanager            48 MiB
#   node-exporter           32 MiB
#   nginx (demo app)        24 MiB
#   ------------------------------------------
#   total                  872 MiB
#   reserved for the host  152 MiB (kernel, systemd, sshd, dockerd, journald)
#
# These limits are ceilings, not reservations, but the sum is deliberate. If the
# ceilings added up to more than physical RAM, the kernel OOM killer would
# terminate containers without warning, which is worse than a clean restart. The
# 2 GB of swap is a safety net for bursts, not routine memory.
#
# The budget is derived from `docker stats` measurements, not guesses:
#
#   service                measured   ceiling
#   grafana                ~145 MiB    288 MiB
#   cadvisor               ~114 MiB    160 MiB
#   prometheus              ~46 MiB    192 MiB
#   nginx-proxy-manager     ~30 MiB    128 MiB
#   alertmanager            ~18 MiB     48 MiB
#   node-exporter           ~14 MiB     32 MiB
#   nginx (demo app)         ~1 MiB     24 MiB
#
# Each ceiling leaves headroom for the spike when a service is doing real work
# (Grafana building its search index, cAdvisor walking /proc) rather than idling.
# A ceiling that is too tight is not a saving: Docker answers an overrun by
# invoking the OOM killer inside that container's cgroup, so the container exits
# 137 and restarts, which is exactly the failure these limits exist to prevent.
# Two of them were hit that way while tuning this file (cAdvisor at 64 MiB,
# Grafana at 224 MiB).
#
# Note that these ceilings are NOT reservations and the host does not reserve its
# 152 MiB: with all seven running, `docker stats` sums to ~380 MiB and the rest is
# the 2 GB of swap absorbing bursts. Expect to revisit every number here if the
# instance is ever resized.
#
# No port in this stack is reachable from the internet: the ports are bound to
# 127.0.0.1 inside the VM and the GCP firewall only allows 80/443. Access goes
# through an SSH tunnel over IAP:
#   gcloud compute ssh instancia-devops-gcp --tunnel-through-iap \
#     --zone us-central1-a --tunnel-iap -L 3000:localhost:3000 -L 9090:localhost:9090
#
# STARTUP IS VERY SLOW HERE AND THE TIMINGS REFLECT IT. Measured on this
# instance: Grafana takes ~8 minutes to register its 56 bundled plugins and ~20
# minutes in total to bind port 3000. The e2-micro is a shared-core burstable
# machine (2 vCPUs, throttled to a small sustained baseline), and Grafana's boot
# is entirely CPU-bound, so cAdvisor and Prometheus scraping in parallel stretch it
# further.
#
# The healthcheck therefore allows a 30-minute start_period, and tasks/stacks.yml
# widens `docker compose up --wait-timeout` to match. With the original 40s
# start_period Docker reports a Grafana that is merely booting as `unhealthy`,
# which fails the deployment while the dashboard is seconds away from working.
# If this ever needs to be faster, the lever is the instance size, not the
# timeouts.
# ============================================================

# Log rotation. Without it the json-file driver writes until it fills the 30 GB
# disk, which cannot be enlarged on a free tier instance.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_VERSION:-v3.15.0}
    container_name: prometheus
    restart: unless-stopped
    user: "65534:65534"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Without retention limits the TSDB grows until it fills the disk. Both
      # dimensions are bounded: time and size.
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROMETHEUS_RETENTION_SIZE:-2GB}
      # Allows reloading the config with `curl -X POST /-/reload` without
      # restarting the container and without losing the in-memory TSDB state.
      - --web.enable-lifecycle
    # Bound to loopback: NOT reachable from the internet, but reachable locally.
    # This is what makes the SSH tunnel work:
    #   -L 9090:localhost:9090
    # Binding to 127.0.0.1 and not 0.0.0.0 matters: even if the GCP firewall
    # were ever opened by mistake, the port would still refuse outside
    # connections. `expose` would NOT work here, because it only documents the
    # port inside the container network without publishing it on the host, so
    # there would be nothing for the tunnel to forward to.
    ports:
      - "127.0.0.1:9090:9090"
    healthcheck:
      # /-/healthy is the Prometheus liveness endpoint. `wget` comes from busybox
      # in the official image.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9090/-/healthy || exit 1"]
      interval: 30s
      timeout: 5s
      # Startup grace period: Prometheus takes a while to load the TSDB, and
      # without start_period a slow start counts as a failure.
      retries: 3
      start_period: 45s
    # 192 MiB against a measured ~46 MiB. The TSDB is capped separately at 2 GB on
    # disk by --storage.tsdb.retention.size, so this ceiling is about the process,
    # not the data.
    mem_limit: 192m
    logging: *default-logging
    networks: [observability]

  node-exporter:
    image: prom/node-exporter:${NODE_EXPORTER_VERSION:-v1.12.1}
    container_name: node-exporter
    restart: unless-stopped
    # Read-only: the exporter has nothing to write.
    read_only: true
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro,rslave
    command:
      - --path.procfs=/host/proc
      - --path.rootfs=/rootfs
      - --path.sysfs=/host/sys
      # Without this filter the exporter also scrapes filesystems mounted inside
      # the container and duplicates series.
      - --collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)
    pid: host
    expose:
      - "9100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9100/metrics || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    mem_limit: 32m
    logging: *default-logging
    networks: [observability]

  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.2.3}
    container_name: grafana
    restart: unless-stopped
    ports:
      # Loopback only, same reasoning as Prometheus above. Reachable through
      # -L 3000:localhost:3000, never from the internet.
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      # Read-only provisioning: Grafana reads the data source and dashboard
      # definitions from disk on start. Mounting them means a fresh volume comes
      # up already connected instead of depending on someone clicking through
      # the setup wizard.
      #
      # Two sibling mounts, deliberately not one. The dashboards live outside
      # provisioning/ so that Grafana, which scans the provider's `path` for
      # JSON, never tries to parse the provider file itself.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro
    environment:
      # No default credentials in the repository. The value comes from the .env
      # file on the server (see .env.example), which is not versioned.
      GF_SECURITY_ADMIN_USER: ${GF_SECURITY_ADMIN_USER:?set GF_SECURITY_ADMIN_USER in .env}
      GF_SECURITY_ADMIN_PASSWORD: ${GF_SECURITY_ADMIN_PASSWORD:?set GF_SECURITY_ADMIN_PASSWORD in .env}
      # Without this, anyone reaching port 3000 could create an account.
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # false because Grafana is reached over plain HTTP through the tunnel.
      # If Grafana is ever put behind Nginx Proxy Manager with TLS, this must
      # become "true", otherwise the browser will refuse the session cookie.
      GF_SECURITY_COOKIE_SECURE: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      # No login form to a stranger: the first request with the session cookie
      # expires after a week, and an idle instance should not keep sessions open.
      GF_SECURITY_SESSION_IDLE_TIMEOUT_HOURS: 24
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # The single biggest cause of Grafana's 15+ minute startup on this instance.
      # On boot, `plugin.backgroundinstaller` asks https://grafana.com for the
      # latest version of every bundled plugin. Each request runs to its timeout
      # ("context deadline exceeded" in the log) because the link is slow, and the
      # check cannot start until plugins finish registering. The plugins shipped
      # inside the image are already version-matched to this release, so the check
      # can never find anything useful -- it only costs minutes on every boot.
      # `GF_ANALYTICS_CHECK_FOR_UPDATES` above is the Grafana-core equivalent; this
      # is the plugin half.
      GF_PLUGINS_CHECK_FOR_UPDATES: "false"
      # Makes the UI usable over a tunnel on a small screen instead of rendering
      # a desktop-width layout squeezed into a browser window.
      GF_SERVER_ROOT_URL: "%(protocol)s://%(domain)s:%(http_port)s/"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 1800s
    # 288 MiB against a measured ~145 MiB working set. Grafana is a Go runtime
    # holding a plugin registry, a SQLite database and a bleve search index; it
    # spikes well above its idle footprint while building the index at boot, and
    # was OOM-killed (exit 137) at the previous 224 MiB ceiling.
    mem_limit: 288m
    logging: *default-logging
    networks: [observability]

  # ------------------------------------------------------------------
  # Alertmanager: the component that actually delivers the alerts.
  #
  # Before this existed, Prometheus evaluated every rule in alerts.yml and then
  # dropped the result. An alerting system that notifies nobody is worse than no
  # alerting system, because it creates a false sense of coverage.
  # ------------------------------------------------------------------
  alertmanager:
    image: prom/alertmanager:${ALERTMANAGER_VERSION:-v0.34.1}
    container_name: alertmanager
    restart: unless-stopped
    user: "65534:65534"
    volumes:
      - ./alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      # Silences and notification log live on disk. Without this they disappear
      # on restart, which loses the history of "who was notified and when".
      - --storage.path=/alertmanager
      # The UI is useful when debugging routing, and it is bound to loopback so
      # it cannot be reached from the internet.
      - --web.listen-address=:9093
    ports:
      - "127.0.0.1:9093:9093"
    healthcheck:
      # /-/ready is the readiness endpoint: 200 only once the config has loaded
      # and the notification log is replayable.
      test: ["CMD-SHELL", "wget -q --spider http://localhost:9093/-/ready || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 48m
    logging: *default-logging
    networks: [observability]

  # ------------------------------------------------------------------
  # cAdvisor: per-container CPU, memory and filesystem metrics.
  #
  # node-exporter answers "how is the host doing". cAdvisor answers "which
  # container is responsible", which is the question that actually matters when
  # five containers share 1 GB. It is what makes the container alerts below
  # meaningful instead of decorative.
  #
  # Two flags matter on this instance:
  #   --docker_only: ignore containers belonging to other Docker installations
  #   --housekeeping_interval: cAdvisor's default 10s is aggressive; 30s cuts
  #                            its CPU and memory cost roughly in half with no
  #                            practical loss of resolution at a 15s scrape.
  # ------------------------------------------------------------------
  # Registry note: Google stopped publishing new cAdvisor releases to
  # gcr.io/cadvisor/cadvisor. That image still carries old tags plus ones
  # literally named "no-new-use-public-image-*", and a pinned recent version
  # fails to pull with:
  #   failed to resolve reference "gcr.io/cadvisor/cadvisor:v0.60.6": not found
  # ghcr.io/google/cadvisor is where the project publishes now, and it has the
  # same v0.60.x tags. Do not "fix" this back to gcr.io without checking that
  # the tag exists first.
  cadvisor:
    image: ghcr.io/google/cadvisor:${CADVISOR_VERSION:-v0.60.6}
    container_name: cadvisor
    restart: unless-stopped
    privileged: false
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    command:
      - --docker_only=true
      - --housekeeping_interval=30s
      - --store_container_labels=false
    expose:
      # Reached by Prometheus over the internal network only. No host port is
      # needed: nothing outside the observability network scrapes it.
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 160 MiB against a measured ~114 MiB. At the original 64 MiB it sat at 92%
    # and was OOM-killed (exit 137). Its footprint scales with the number of
    # containers on the host, because it walks /var/lib/docker and /proc.
    mem_limit: 160m
    logging: *default-logging
    networks: [observability]

volumes:
  # Named volumes rather than bind mounts: the data survives
  # `docker compose down` and is managed with `docker volume`.
  prometheus_data:
  grafana_data:
  alertmanager_data:

networks:
  # Dedicated network: Prometheus only talks to Grafana and node-exporter.
  # Isolating it reduces what is reachable if a container is compromised.
  observability:
    driver: bridge